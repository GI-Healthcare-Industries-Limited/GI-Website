    <style>
      /* Keep the Careers film and its rounded edge in one native layer. A
         Flutter SVG clip around the platform video can drift during scrolling
         in Safari. No transform, fixed positioning or independent scrolling. */
      flutter-view video {
        display: block;
        object-fit: cover;
        border-radius: 16px;
      }
    </style>
  
    <!-- Flutter -->
    <script>
      // The previous GitHub Pages build used Flutter's service worker and could
      // keep serving an old website after a deployment. Remove that legacy
      // registration before starting the application.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();
          });
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.filter(function(key) {
              return key.startsWith('flutter-');
            }).forEach(function(key) {
              caches.delete(key);
            });
          });
        }
      }
    </script>
    <script>
      // Record readiness even if the consent script loads after Flutter's first frame.
      window.addEventListener('flutter-first-frame', function () {
        document.documentElement.dataset.giFlutterReady = 'true';
      }, {once: true});
    </script>
